name: Weekly Iqbal specials

on:
  schedule:
    # Thursdays 10:00 UTC, after most Ontario flyers flip on Thursday morning
    - cron: "0 10 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scrape_iqbal.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/iqbal.json
          git diff --cached --quiet || git commit -m "Update Iqbal specials $(date -u +%F)"
          git push
